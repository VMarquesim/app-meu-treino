let _uid=Date.now();const uid=()=>'id'+(_uid++);

function Timer({seconds:initSec}){
  const[time,setTime]=useState(initSec);
  const[running,setRunning]=useState(false);
  const[done,setDone]=useState(false);
  const[sel,setSel]=useState(initSec);
  const ref=useRef(null);
  const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const start=()=>{
    if(running){clearInterval(ref.current);setRunning(false);setTime(sel);setDone(false);return}
    setDone(false);setRunning(true);setTime(sel);
    ref.current=setInterval(()=>setTime(t=>{
      if(t<=1){clearInterval(ref.current);setRunning(false);setDone(true);try{navigator.vibrate([100,50,100,50,200])}catch{}setTimeout(()=>setDone(false),3000);return sel}
      return t-1;
    }),1000);
  };
  const pick=s=>{if(!running){setSel(s);setTime(s)}};
  useEffect(()=>()=>clearInterval(ref.current),[]);
  return React.createElement('div',{style:{textAlign:'center',padding:'12px 0 4px'}},
    React.createElement('div',{style:{fontSize:10,letterSpacing:'.08em',textTransform:'uppercase',color:'#b0b8c8',marginBottom:6}},'Descanso'),
    React.createElement('div',{style:{fontFamily:"'Bebas Neue'",fontSize:44,color:running?'#e8ff47':done?'#47ffe0':'#f0f2f7',transition:'color .3s'}},done?'✓':fmt(time)),
    React.createElement('div',{style:{display:'flex',gap:6,justifyContent:'center',marginTop:8,flexWrap:'wrap'}},
      ...[45,60,75,90,120].map(s=>React.createElement('button',{key:s,onClick:()=>pick(s),style:{background:sel===s?'#47ffe0':'#1a1f2a',border:'1px solid '+(sel===s?'#47ffe0':'#252a35'),borderRadius:6,padding:'6px 12px',fontSize:11,fontWeight:500,color:sel===s?'#0a0a0a':'#b0b8c8',cursor:'pointer'}},s+'s')),
      React.createElement('button',{onClick:start,style:{background:running?'#ff4747':'#47ffe0',border:'none',borderRadius:6,padding:'6px 14px',fontSize:11,fontWeight:700,color:running?'#fff':'#0a0a0a',cursor:'pointer'}},running?'⏹':'▶')
    )
  );
}

function App(){

  const[exercises,setExercises]=useState(()=>S.get('exercises',DEF_EX));
  const[workout,setWorkout]=useState(()=>S.get('workout',DEF_WK));

  const[checks,setChecks]=useState(()=>S.get('checks',{}));
  const[weights,setWeights]=useState(()=>S.get('weights',{}));
  const[weekData,setWeekData]=useState(()=>S.get('weekData',{week:1,completed:0,days:{}}));
  const[bodyRecords,setBodyRecords]=useState(()=>S.get('body',[]));
  const[openEx,setOpenEx]=useState(null);
  const[bankFilter,setBankFilter]=useState('Todos');
  const[bankSearch,setBankSearch]=useState('');
  const[editingEx,setEditingEx]=useState(null);
  const[editingDay,setEditingDay]=useState(null);
  const[dragIdx,setDragIdx]=useState(null);
  const[bodyForm,setBodyForm]=useState(null);
  const[modal,setModal]=useState(null);

  useEffect(()=>S.set('exercises',exercises),[exercises]);
  useEffect(()=>S.set('workout',workout),[workout]);
  useEffect(()=>S.set('checks',checks),[checks]);
  useEffect(()=>S.set('weights',weights),[weights]);
  useEffect(()=>S.set('weekData',weekData),[weekData]);
  useEffect(()=>S.set('body',bodyRecords),[bodyRecords]);

  const getEx=id=>exercises.find(e=>e.id===id)||{name:'???',group:'?',tip:'',equip:'?'};
  const toggleCheck=(dayId,ei,si)=>{const k=`${dayId}_${ei}_${si}`;const nc={...checks,[k]:!checks[k]};setChecks(nc);if(!checks[k])try{navigator.vibrate(30)}catch{}};
  const setWt=(dayId,ei,si,v)=>setWeights(w=>({...w,[`${dayId}_${ei}_${si}`]:v}));

  const isDayDone=day=>{if(!day)return false;return day.exercises.every((ex,ei)=>{for(let si=0;si<ex.sets;si++){if(!checks[`${day.id}_${ei}_${si}`])return false}return true})};
  const dayProg=day=>{if(!day)return 0;let t=0,d=0;day.exercises.forEach((ex,ei)=>{for(let si=0;si<ex.sets;si++){t++;if(checks[`${day.id}_${ei}_${si}`])d++}});return t?Math.round(d/t*100):0};

  useEffect(()=>{
    const wd={...weekData};let ch=false;
    workout.forEach(day=>{const c=isDayDone(day);if(c!==wd.days[day.id]){wd.days[day.id]=c;ch=true}});
    if(ch)setWeekData(wd);
    if(workout.every(d=>wd.days[d.id])&&!modal)setModal('weekComplete');
  },[checks]);

  const resetDay=dayId=>{const nc={...checks};Object.keys(nc).filter(k=>k.startsWith(dayId+'_')).forEach(k=>delete nc[k]);setChecks(nc);const wd={...weekData};wd.days[dayId]=false;setWeekData(wd)};
  const newWeek=()=>{setChecks({});const all=workout.every(d=>weekData.days[d.id]);setWeekData({week:weekData.week+1,completed:weekData.completed+(all?1:0),days:{}});setActiveDay(0);setModal(null)};
  const resetAll=()=>{S.clear();setExercises(DEF_EX);setWorkout(DEF_WK);setChecks({});setWeights({});setWeekData({week:1,completed:0,days:{}});setBodyRecords([]);setActiveDay(0);setModal(null);setScreen('train')};

  const saveEx=ex=>{if(exercises.find(e=>e.id===ex.id))setExercises(exercises.map(e=>e.id===ex.id?ex:e));else setExercises([...exercises,ex]);setEditingEx(null)};
  const delEx=id=>{setExercises(exercises.filter(e=>e.id!==id));setEditingEx(null)};

  const addExToDay=(di,exId)=>{const ex=getEx(exId);const nw=[...workout];nw[di]={...nw[di],exercises:[...nw[di].exercises,{exId,sets:ex.defaultSets||3,reps:ex.defaultReps||'10-12',rest:ex.defaultRest||60}]};setWorkout(nw)};
  const rmExFromDay=(di,ei)=>{const nw=[...workout];nw[di]={...nw[di],exercises:nw[di].exercises.filter((_,i)=>i!==ei)};setWorkout(nw)};
  const moveEx=(di,from,to)=>{if(from===to)return;const nw=[...workout];const a=[...nw[di].exercises];const[item]=a.splice(from,1);a.splice(to,0,item);nw[di]={...nw[di],exercises:a};setWorkout(nw)};
  const updExInDay=(di,ei,f,v)=>{const nw=[...workout];nw[di]={...nw[di],exercises:nw[di].exercises.map((e,i)=>i===ei?{...e,[f]:v}:e)};setWorkout(nw)};
  const addDay=()=>setWorkout([...workout,{id:uid(),name:'Novo Dia',subtitle:'',warmup:'5 min aquecimento',cardio:'',exercises:[]}]);

  const updDay=(idx,f,v)=>{const nw=[...workout];nw[idx]={...nw[idx],[f]:v};setWorkout(nw)};

  const prevB=bodyRecords.length>1?bodyRecords[bodyRecords.length-2]:null;
  const bDelta=(f,inv)=>{if(!lastB||!prevB||!lastB[f]||!prevB[f])return null;const d=lastB[f]-prevB[f];return{val:d.toFixed(1),good:inv?d<0:d>0}};

  const c={

    topbar:{position:'sticky',top:0,zIndex:100,background:'rgba(10,10,10,.92)',backdropFilter:'blur(14px)',WebkitBackdropFilter:'blur(14px)',borderBottom:'1px solid #252a35',padding:'14px 20px'},
    lbl:{fontSize:10,color:'#b0b8c8',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600},
  };

  const h=React.createElement;

  // ===== TRAIN SCREEN =====
  const Train=()=>{
    const day=workout[activeDay];
    if(!day)return h('div',{style:{padding:20,textAlign:'center',color:'#666'}},'Nenhum treino. Vá em Montar para criar.');
    const prog=dayProg(day);
    return h('div',null,
      h('div',{style:c.topbar},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
          h('div',null,h('div',{style:{fontFamily:"'Bebas Neue'",fontSize:22,color:'#f0f2f7'}},h('span',null,'MEU '),h('span',{style:{color:'#e8ff47'}},'TREINO')),h('div',{style:{fontSize:11,color:'#b0b8c8',marginTop:2}},'Semana '+weekData.week+' · '+weekData.completed+' completas')),
          h('div',{style:{textAlign:'right'}},h('div',{style:{fontSize:11,color:'#b0b8c8'}},'Progresso'),h('div',{style:{fontFamily:"'Bebas Neue'",fontSize:22,color:'#e8ff47'}},prog+'%'))
        ),
        h('div',{style:{height:4,background:'#1a1f2a',borderRadius:2,marginTop:10,overflow:'hidden'}},h('div',{style:{height:'100%',background:'linear-gradient(90deg,#47ffe0,#e8ff47)',borderRadius:2,width:prog+'%',transition:'width .4s'}}))
      ),
      h('div',{style:{display:'flex',justifyContent:'center',gap:6,padding:'10px 20px',background:'#141820',borderBottom:'1px solid #252a35'}},

      h('div',{style:{background:'#141820',border:'1px solid #252a35',borderRadius:16,padding:'24px 20px',textAlign:'center',maxWidth:320}},
        h('div',{style:{fontFamily:"'Bebas Neue'",fontSize:22,color:'#f0f2f7',marginBottom:8}},'🗑️ Zerar Tudo'),
        h('p',{style:{fontSize:13,color:'#b0b8c8',lineHeight:1.6,marginBottom:20}},'Apaga TUDO. Irreversível!'),
        h('div',{style:{display:'flex',gap:10}},h('button',{onClick:()=>setModal(null),style:{...c.btn('#1a1f2a','#b0b8c8'),flex:1,border:'1px solid #252a35'}},'Cancelar'),h('button',{onClick:resetAll,style:{...c.btn('#ff4747','#fff'),flex:1}},'Zerar'))
      )
    )
  );

  // ===== NAV =====
  const navItems=[{id:'train',icon:'🏋️',label:'Treinar'},{id:'bank',icon:'📚',label:'Exercícios'},{id:'builder',icon:'🔧',label:'Montar'},{id:'body',icon:'📊',label:'Corpo'}];

  return h('div',{style:{background:'#0a0a0a',minHeight:'100dvh',color:'#b0b8c8',paddingBottom:80}},
    screen==='train'&&h(Train),
    screen==='bank'&&h(Bank),
    screen==='builder'&&h(Builder),
    screen==='body'&&h(Body),
    h(Modals),
    h('nav',{style:{position:'fixed',bottom:0,left:0,right:0,background:'rgba(10,10,10,.95)',backdropFilter:'blur(14px)',borderTop:'1px solid #252a35',display:'flex',zIndex:200,padding:'6px 0',paddingBottom:'max(6px,env(safe-area-inset-bottom))'}},
      navItems.map(n=>h('button',{key:n.id,onClick:()=>{setScreen(n.id);setEditingEx(null);setEditingDay(null)},style:{flex:1,background:'none',border:'none',padding:'8px 4px',textAlign:'center',cursor:'pointer',color:screen===n.id?'#e8ff47':'#666',fontSize:10,fontWeight:screen===n.id?600:400}},
        h('span',{style:{fontSize:18,display:'block',marginBottom:2}},n.icon),n.label
      ))
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(r=>console.log('SW registered',r.scope)).catch(e=>console.log('SW failed',e));
  });
}
</script>
